[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "timewarp"
description = "Return to days begone."
readme = "README.rst"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["version"]
keywords = []
authors = [
  { name = "Sebastian Gottfried", email = "sebastian.gottfried@dlr.de" },
]
dependencies = [
    "textual",
    "tomli>=2; python_version < '3.11'",
    "tomli-w",
]


[project.optional-dependencies]
dev = [
    'check-manifest',
    'docutils<0.19',
    'pylint',
    'pytest',
    'pytest-asyncio',
    'pytest-cov',
    'pytest-mock',
    'textual-dev',
    'wheel',
]

[project.scripts]
timewarp = "timewarp.__main__:main"



[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=timewarp --cov-report=term-missing"


[tool.coverage.run]
branch = true
source = ["timewarp"]


[tool.coverage.report]
fail_under = 90
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]


[tool.pylint.MASTER]
max-line-length = 120
recursive = true
ignore = ["venv", "build", "dist"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "fixme",
]
good-names-rgxs = "^[_a-z][_a-z0-9]?$"


[tool.distutils.bdist_wheel]
universal = true

